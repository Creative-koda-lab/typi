version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: typivibe-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: typivibe
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - typivibe-network

  # Optional: MongoDB Express for database management UI
  mongo-express:
    image: mongo-express:latest
    container_name: typivibe-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    depends_on:
      - mongodb
    networks:
      - typivibe-network

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  typivibe-network:
    driver: bridge
